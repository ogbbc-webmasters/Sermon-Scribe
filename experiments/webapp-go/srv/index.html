<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sermon Scribe - Sermon Metadata Extractor</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 18px;
            line-height: 1.6;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
            color: #333;
        }
        h1 { color: #2c3e50; text-align: center; font-size: 2.2em; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.1em; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #2c3e50; }
        input[type="file"] {
            width: 100%;
            padding: 15px;
            font-size: 1em;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #2980b9; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        .btn-primary { width: 100%; padding: 16px; font-size: 1.1em; }
        .btn-secondary { background: #95a5a6; }
        .btn-secondary:hover { background: #7f8c8d; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-copy { background: #27ae60; padding: 6px 12px; font-size: 0.85em; }
        .btn-copy:hover { background: #219a52; }
        .hidden { display: none !important; }
        
        @keyframes progress-shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .progress-bar-animated {
            background: linear-gradient(90deg, #3498db 0%, #2ecc71 25%, #3498db 50%, #2ecc71 75%, #3498db 100%);
            background-size: 200% 100%;
            animation: progress-shimmer 2s linear infinite;
        }
        
        /* Sermon Detail Desktop Layout */
        .sermon-detail-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .sermon-detail-columns {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .sermon-left-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sermon-right-col {
            display: flex;
            flex-direction: column;
        }
        .metadata-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }
        .metadata-label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 6px;
            font-size: 0.95em;
        }
        .tag { 
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            margin: 2px;
            font-size: 0.9em;
        }
        .tag-scripture { background: #e74c3c; color: white; }
        .tag-topic { background: #3498db; color: white; }
        .transcript-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            min-height: 200px;
        }
        .transcript-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .transcript-search-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .transcript-search-row input {
            flex: 1;
            min-width: 150px;
            padding: 10px 14px;
            font-size: 1em;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .transcript-content {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 0.95em;
            line-height: 1.7;
            max-height: 300px;
        }
        .search-nav-btn {
            padding: 8px 14px;
            font-size: 1em;
            min-width: 80px;
        }
        
        @media (min-width: 900px) {
            body {
                max-width: 1200px;
                padding: 15px 20px;
            }
            .card { padding: 20px; margin-bottom: 15px; }
            #sermon-detail {
                height: calc(100vh - 50px);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .sermon-detail-content {
                flex: 1;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }
            .sermon-detail-columns {
                flex: 1;
                flex-direction: row;
                overflow: hidden;
            }
            .sermon-left-col {
                width: 38%;
                flex-shrink: 0;
                overflow-y: auto;
                padding-right: 15px;
            }
            .sermon-right-col {
                width: 62%;
                overflow: hidden;
            }
            .transcript-box {
                height: 100%;
                min-height: 0;
            }
            .transcript-content {
                max-height: none;
                flex: 1;
                min-height: 0;
            }
            .sermon-header {
                flex-shrink: 0;
            }
            .sermon-footer {
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>
    <div id="page-header">
        <h1>📖 Sermon Scribe</h1>
        <p class="subtitle">Extract metadata from sermon audio files</p>
    </div>

    <div id="error" class="card hidden" style="background:#fee;border:1px solid #e74c3c;color:#c0392b;"></div>

    <div id="login-section" class="card hidden" style="text-align:center;">
        <p style="font-size:1.2em;margin-bottom:20px;">Please log in to upload sermons</p>
        <button onclick="location.href='/__exe.dev/login?redirect=/'" style="width:auto;padding:15px 40px;">🔐 Log In</button>
    </div>

    <!-- Sermon List -->
    <div id="sermon-list" class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
            <h2 style="margin:0;color:#2c3e50;">📋 Recent Sermons</h2>
            <button id="upload-btn" onclick="showUploadForm()">➕ Upload New</button>
        </div>
        <div id="sermons-container"></div>
    </div>

    <!-- Upload Form (hidden by default) -->
    <div id="upload-section" class="card hidden">
        <h2 style="margin-top:0;color:#2c3e50;">📤 Upload Sermon</h2>
        <label for="audio-file">Audio File (MP3/WAV)</label>
        <input type="file" id="audio-file" accept=".mp3,.wav,audio/*">
        <div id="file-info" class="hidden" style="background:#e8f4fd;padding:10px 15px;border-radius:6px;margin-bottom:15px;"></div>
        <div id="usage-info" class="hidden" style="background:#e8f4fd;padding:10px 15px;border-radius:6px;margin-bottom:15px;"></div>
        <div style="display:flex;gap:10px;">
            <button class="btn-primary" onclick="uploadSermon()" id="submit-btn">🎙️ Process Sermon</button>
            <button class="btn-secondary" onclick="hideUploadForm()" style="flex-shrink:0;">Cancel</button>
        </div>
    </div>

    <!-- Sermon Detail View -->
    <div id="sermon-detail" class="card hidden"></div>

<script>
let isLoggedIn = false;
let currentSermonId = null;
let currentEventSource = null;  // Track active SSE connection
let searchMatchIndex = -1;  // Current highlighted match index (-1 = none)
let searchMatchCount = 0;   // Total number of matches

async function init() {
    await checkAuth();
    await loadSermons();
    
    // Check URL for sermon ID
    const params = new URLSearchParams(location.search);
    if (params.get('sermon')) {
        showSermonDetail(params.get('sermon'));
    }
}

async function checkAuth() {
    try {
        const resp = await fetch('/api/usage');
        if (resp.status === 401) {
            isLoggedIn = false;
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('upload-btn').classList.add('hidden');
        } else {
            isLoggedIn = true;
            const data = await resp.json();
            updateUsageDisplay(data);
        }
    } catch (e) {
        console.error('Auth check failed:', e);
    }
}

function updateUsageDisplay(data) {
    const el = document.getElementById('usage-info');
    el.classList.remove('hidden');
    if (data.used >= data.limit) {
        el.innerHTML = `⚠️ Daily limit reached (${data.used}/${data.limit}). Try again tomorrow.`;
        el.style.background = '#fff3cd';
        document.getElementById('submit-btn').disabled = true;
    } else {
        el.innerHTML = `📊 Usage: ${data.used}/${data.limit} sermons today`;
    }
}

async function loadSermons() {
    try {
        const resp = await fetch('/api/sermons');
        const sermons = await resp.json();
        renderSermonList(sermons || []);
    } catch (e) {
        showError('Failed to load sermons: ' + e.message);
    }
}

function renderSermonList(sermons) {
    const container = document.getElementById('sermons-container');
    if (sermons.length === 0) {
        container.innerHTML = '<p style="color:#666;text-align:center;padding:20px;">No sermons yet. Upload one to get started!</p>';
        return;
    }
    
    container.innerHTML = sermons.map(s => {
        const job = s.latest_job;
        let statusBadge = '';
        if (job) {
            if (job.status === 'pending') statusBadge = '<span style="background:#f39c12;color:white;padding:2px 8px;border-radius:10px;font-size:0.8em;">⏳ Pending</span>';
            else if (job.status === 'processing') statusBadge = '<span style="background:#3498db;color:white;padding:2px 8px;border-radius:10px;font-size:0.8em;">⚙️ Processing</span>';
            else if (job.status === 'error') statusBadge = '<span style="background:#e74c3c;color:white;padding:2px 8px;border-radius:10px;font-size:0.8em;">❌ Error</span>';
            else if (job.status === 'complete') statusBadge = '<span style="background:#27ae60;color:white;padding:2px 8px;border-radius:10px;font-size:0.8em;">✓ Complete</span>';
        }
        const title = s.title || s.filename || 'Untitled';
        const date = new Date(s.created_at).toLocaleDateString();
        return `
            <div style="padding:15px;border-bottom:1px solid #eee;cursor:pointer;" onclick="showSermonDetail('${s.id}')">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div>
                        <strong style="font-size:1.1em;">${escapeHtml(title)}</strong>
                        ${s.speaker ? '<span style="color:#666;"> — ' + escapeHtml(s.speaker) + '</span>' : ''}
                    </div>
                    ${statusBadge}
                </div>
                <div style="color:#888;font-size:0.9em;margin-top:5px;">${date} • ${formatSize(s.file_size)}</div>
            </div>
        `;
    }).join('');
}

function showUploadForm() {
    if (!isLoggedIn) {
        location.href = '/__exe.dev/login?redirect=/';
        return;
    }
    document.getElementById('upload-section').classList.remove('hidden');
    document.getElementById('sermon-list').classList.add('hidden');
}

function hideUploadForm() {
    document.getElementById('upload-section').classList.add('hidden');
    document.getElementById('sermon-list').classList.remove('hidden');
    document.getElementById('audio-file').value = '';
    document.getElementById('file-info').classList.add('hidden');
}

document.getElementById('audio-file').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const info = document.getElementById('file-info');
    if (file) {
        info.innerHTML = `<strong>📁 ${file.name}</strong> (${formatSize(file.size)})`;
        info.classList.remove('hidden');
    } else {
        info.classList.add('hidden');
    }
});

async function uploadSermon() {
    const fileInput = document.getElementById('audio-file');
    const file = fileInput.files[0];
    if (!file) {
        showError('Please select an audio file.');
        return;
    }

    const formData = new FormData();
    formData.append('audio', file);

    document.getElementById('submit-btn').disabled = true;
    document.getElementById('submit-btn').textContent = '⏳ Uploading...';

    try {
        const resp = await fetch('/api/sermons', { method: 'POST', body: formData });
        const data = await resp.json();
        
        if (!resp.ok) {
            throw new Error(data.error || 'Upload failed');
        }

        hideUploadForm();
        await loadSermons();
        showSermonDetail(data.sermon.id);
    } catch (e) {
        showError('Upload failed: ' + e.message);
    } finally {
        document.getElementById('submit-btn').disabled = false;
        document.getElementById('submit-btn').textContent = '🎙️ Process Sermon';
    }
}

async function showSermonDetail(id) {
    currentSermonId = id;
    history.pushState({}, '', '?sermon=' + id);
    
    document.getElementById('sermon-list').classList.add('hidden');
    document.getElementById('upload-section').classList.add('hidden');
    document.getElementById('page-header').classList.add('hidden');
    document.getElementById('sermon-detail').classList.remove('hidden');
    document.getElementById('sermon-detail').innerHTML = '<p style="text-align:center;">Loading...</p>';

    try {
        const resp = await fetch('/api/sermons/' + id);
        if (!resp.ok) throw new Error('Sermon not found');
        const data = await resp.json();
        renderSermonDetail(data.sermon, data.jobs);
        
        // If there's an active job, stream updates
        if (data.jobs && data.jobs.length > 0) {
            const job = data.jobs[0];
            if (job.status === 'pending' || job.status === 'processing') {
                streamJobUpdates(job.id, data.sermon.id);
            }
        }
    } catch (e) {
        document.getElementById('sermon-detail').innerHTML = '<p style="color:#c0392b;">Error: ' + e.message + '</p>';
    }
}

function renderSermonDetail(sermon, jobs) {
    const job = jobs && jobs[0];
    const isProcessing = job && (job.status === 'pending' || job.status === 'processing');
    const hasError = job && job.status === 'error';
    const isComplete = job && job.status === 'complete';
    const hasContent = isComplete || sermon.transcript;

    let content = `
        <div class="sermon-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
            <button class="btn-secondary" onclick="backToList()">← Back</button>
        </div>
    `;

    if (isProcessing) {
        content += `
            <div id="progress-section" style="background:#e8f4fd;padding:15px;border-radius:8px;margin-bottom:15px;">
                <p style="margin:0 0 8px 0;font-weight:600;">⏳ Processing...</p>
                <p id="progress-text" style="margin:0;color:#666;">${job.progress || 'Waiting to start...'}</p>
                <div style="background:#ddd;border-radius:10px;height:16px;margin-top:10px;overflow:hidden;">
                    <div id="progress-bar" class="progress-bar-animated" style="height:100%;transition:width 0.3s;width:${job.percent >= 0 ? job.percent : 5}%;min-width:5%;"></div>
                </div>
            </div>
        `;
    }

    if (hasError) {
        console.error('Job error:', job.error);
        content += `
            <div style="background:#fee;border:1px solid #e74c3c;padding:12px;border-radius:8px;margin-bottom:15px;color:#c0392b;">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div><strong>❌ Processing failed.</strong> Please try again.</div>
                    ${isLoggedIn ? '<button onclick="retryJob(\''+job.id+'\')" style="background:#e74c3c;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;">🔄 Retry</button>' : ''}
                </div>
            </div>
        `;
    }

    content += '<div class="sermon-detail-content">';
    
    if (hasContent) {
        content += '<div class="sermon-detail-columns">';
        
        // Left column: title, speaker, reasoning, scriptures, topics
        content += '<div class="sermon-left-col">';
        
        // Title section
        content += `
            <div>
                <h2 style="margin:0 0 5px 0;color:#2c3e50;font-size:1.4em;">${escapeHtml(sermon.title || sermon.filename || 'Untitled')}</h2>
                ${sermon.speaker ? '<p style="color:#666;margin:0 0 5px 0;">Speaker: ' + escapeHtml(sermon.speaker) + '</p>' : ''}
                ${sermon.title_reasoning ? '<details style="margin-top:5px;"><summary style="cursor:pointer;color:#888;font-size:0.85em;">💡 Why this title?</summary><p style="color:#666;margin:5px 0 0 0;font-size:0.85em;font-style:italic;">' + escapeHtml(sermon.title_reasoning) + '</p></details>' : ''}
            </div>
        `;
        
        if (sermon.scriptures && sermon.scriptures.length > 0) {
            content += `
                <div class="metadata-box">
                    <div class="metadata-label">📖 Scriptures</div>
                    <div>${sermon.scriptures.map(s => '<span class="tag tag-scripture">' + escapeHtml(s) + '</span>').join('')}</div>
                </div>
            `;
        }

        if (sermon.topics && sermon.topics.length > 0) {
            const topicsHtml = sermon.topics.map(t => {
                const reasoning = sermon.topics_reasoning && sermon.topics_reasoning[t];
                if (reasoning) {
                    return `<details style="display:inline-block;margin:3px;"><summary class="tag tag-topic" style="cursor:pointer;list-style:none;">${escapeHtml(t)} ▼</summary><p style="margin:5px 0;padding:8px;background:#f0f0f0;border-radius:6px;font-size:0.85em;color:#666;">${escapeHtml(reasoning)}</p></details>`;
                }
                return '<span class="tag tag-topic">' + escapeHtml(t) + '</span>';
            }).join('');
            content += `
                <div class="metadata-box">
                    <div class="metadata-label">🏷️ Topics</div>
                    <div>${topicsHtml}</div>
                </div>
            `;
        }
        
        content += '</div>'; // end left col
        
        // Right column: transcript
        content += '<div class="sermon-right-col">';
        
        if (sermon.transcript) {
            content += `
                <div class="transcript-box">
                    <div class="transcript-header">
                        <span class="metadata-label" style="margin:0;">📝 Transcript</span>
                        <button class="btn-copy" onclick="copyTranscript()">Copy</button>
                    </div>
                    <div class="transcript-search-row">
                        <input type="text" id="transcript-search" placeholder="Search transcript..." oninput="searchTranscript()">
                        <div id="search-nav" class="hidden" style="display:flex;align-items:center;gap:8px;">
                            <button class="search-nav-btn" onclick="prevMatch()">◀ Prev</button>
                            <span id="search-match-count" style="font-size:1em;color:#666;white-space:nowrap;"></span>
                            <button class="search-nav-btn" onclick="nextMatch()">Next ▶</button>
                        </div>
                        <span id="search-no-matches" class="hidden" style="font-size:1em;color:#e74c3c;">No matches</span>
                    </div>
                    <div id="transcript-content" class="transcript-content" data-original="${escapeHtml(sermon.transcript).replace(/"/g, '&quot;')}">${escapeHtml(sermon.transcript)}</div>
                </div>
            `;
        }
        
        content += '</div>'; // end right col
        content += '</div>'; // end columns
    } else {
        // No content yet - show title only (during processing)
        content += `
            <div>
                <h2 style="margin:0 0 5px 0;color:#2c3e50;">${escapeHtml(sermon.title || sermon.filename || 'Processing...')}</h2>
                ${sermon.speaker ? '<p style="color:#666;margin:0;">Speaker: ' + escapeHtml(sermon.speaker) + '</p>' : ''}
            </div>
        `;
    }
    
    content += '</div>'; // end sermon-detail-content

    // Delete button
    if (isLoggedIn) {
        content += `
            <div class="sermon-footer" style="margin-top:15px;padding-top:15px;border-top:1px solid #eee;">
                <button class="btn-danger" onclick="deleteSermon('${sermon.id}')">🗑️ Delete Sermon</button>
            </div>
        `;
    }

    document.getElementById('sermon-detail').innerHTML = content;
}

function streamJobUpdates(jobId, sermonId) {
    // Close any existing connection
    if (currentEventSource) {
        currentEventSource.close();
        currentEventSource = null;
    }
    
    const evtSource = new EventSource('/api/jobs/' + jobId + '/stream');
    currentEventSource = evtSource;
    
    evtSource.onmessage = function(e) {
        // Ignore updates if we've navigated away from this sermon
        if (currentSermonId !== sermonId) {
            evtSource.close();
            if (currentEventSource === evtSource) currentEventSource = null;
            return;
        }
        
        const job = JSON.parse(e.data);
        
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        
        if (progressText) progressText.textContent = job.progress || 'Processing...';
        if (progressBar && job.percent >= 0) progressBar.style.width = job.percent + '%';
        
        if (job.status === 'complete' || job.status === 'error') {
            evtSource.close();
            if (currentEventSource === evtSource) currentEventSource = null;
            // Reload the sermon detail only if still viewing this sermon
            if (currentSermonId === sermonId) {
                setTimeout(() => showSermonDetail(currentSermonId), 500);
            }
        }
    };
    
    evtSource.onerror = function() {
        evtSource.close();
        if (currentEventSource === evtSource) currentEventSource = null;
    };
}

function backToList() {
    // Close any active SSE connection
    if (currentEventSource) {
        currentEventSource.close();
        currentEventSource = null;
    }
    currentSermonId = null;
    history.pushState({}, '', '/');
    document.getElementById('sermon-detail').classList.add('hidden');
    document.getElementById('sermon-list').classList.remove('hidden');
    document.getElementById('page-header').classList.remove('hidden');
    loadSermons();
}

async function deleteSermon(id) {
    if (!confirm('Delete this sermon? This cannot be undone.')) return;
    
    try {
        const resp = await fetch('/api/sermons/' + id, { method: 'DELETE' });
        if (!resp.ok) throw new Error('Delete failed');
        backToList();
    } catch (e) {
        showError('Delete failed: ' + e.message);
    }
}

async function retryJob(jobId) {
    try {
        const resp = await fetch('/api/jobs/' + jobId + '/retry', { method: 'POST' });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Retry failed');
        // Reload sermon detail to show processing state
        showSermonDetail(currentSermonId);
    } catch (e) {
        showError('Retry failed: ' + e.message);
    }
}

function copyTranscript() {
    const transcriptEl = document.getElementById('transcript-content');
    // Use original text if available (to avoid copying highlight markup)
    const text = transcriptEl.dataset.original ? 
        transcriptEl.dataset.original.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&quot;/g, '"') :
        transcriptEl.textContent;
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('#sermon-detail .btn-copy');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
    });
}

function searchTranscript() {
    const searchInput = document.getElementById('transcript-search');
    const transcriptEl = document.getElementById('transcript-content');
    const matchCountEl = document.getElementById('search-match-count');
    const searchNavEl = document.getElementById('search-nav');
    const noMatchesEl = document.getElementById('search-no-matches');
    
    if (!searchInput || !transcriptEl) return;
    
    const searchTerm = searchInput.value.trim();
    const originalText = transcriptEl.dataset.original || '';
    
    // Clear highlights if search is empty
    if (!searchTerm) {
        transcriptEl.innerHTML = originalText;
        searchNavEl.classList.add('hidden');
        noMatchesEl.classList.add('hidden');
        searchMatchIndex = -1;
        searchMatchCount = 0;
        return;
    }
    
    // Escape special regex characters in search term
    const escapedTerm = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp('(' + escapedTerm + ')', 'gi');
    
    // Count matches
    const decodedText = originalText.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&quot;/g, '"');
    const matches = decodedText.match(regex);
    searchMatchCount = matches ? matches.length : 0;
    
    // Update match count display
    if (searchMatchCount === 0) {
        searchNavEl.classList.add('hidden');
        noMatchesEl.classList.remove('hidden');
        searchMatchIndex = -1;
        transcriptEl.innerHTML = originalText;
        return;
    } else {
        noMatchesEl.classList.add('hidden');
        searchNavEl.classList.remove('hidden');
        searchNavEl.style.display = 'flex';
        // Start at first match
        searchMatchIndex = 0;
    }
    
    // Highlight matches in the HTML-escaped text with data-match-index
    let matchIdx = 0;
    const highlightedText = originalText.replace(regex, function(match) {
        const idx = matchIdx++;
        return '<mark class="search-match" data-match-index="' + idx + '" style="background:#ffeb3b;padding:2px 4px;border-radius:3px;">' + match + '</mark>';
    });
    transcriptEl.innerHTML = highlightedText;
    
    // Update display and scroll to first match
    updateMatchDisplay();
}

function updateMatchDisplay() {
    const matchCountEl = document.getElementById('search-match-count');
    const transcriptEl = document.getElementById('transcript-content');
    
    if (searchMatchCount === 0) {
        matchCountEl.textContent = '';
        return;
    }
    
    // Update counter text
    matchCountEl.textContent = (searchMatchIndex + 1) + ' of ' + searchMatchCount;
    matchCountEl.style.color = '#27ae60';
    
    // Reset all marks to yellow, then highlight current as orange
    const marks = transcriptEl.querySelectorAll('mark.search-match');
    marks.forEach((mark, idx) => {
        if (idx === searchMatchIndex) {
            mark.style.background = '#ff9800';  // Orange for current
            mark.style.boxShadow = '0 0 0 2px #ff9800';
        } else {
            mark.style.background = '#ffeb3b';  // Yellow for others
            mark.style.boxShadow = 'none';
        }
    });
    
    // Scroll to current match
    const currentMark = transcriptEl.querySelector('mark[data-match-index="' + searchMatchIndex + '"]');
    if (currentMark) {
        currentMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

function nextMatch() {
    if (searchMatchCount === 0) return;
    searchMatchIndex = (searchMatchIndex + 1) % searchMatchCount;  // Wrap around
    updateMatchDisplay();
}

function prevMatch() {
    if (searchMatchCount === 0) return;
    searchMatchIndex = (searchMatchIndex - 1 + searchMatchCount) % searchMatchCount;  // Wrap around
    updateMatchDisplay();
}

function showError(msg) {
    const el = document.getElementById('error');
    el.textContent = msg;
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 5000);
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

window.onpopstate = function() {
    const params = new URLSearchParams(location.search);
    if (params.get('sermon')) {
        showSermonDetail(params.get('sermon'));
    } else {
        backToList();
    }
};

init();
</script>
