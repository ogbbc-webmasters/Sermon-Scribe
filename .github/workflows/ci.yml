name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Elm 0.19.2
        run: |
          curl -fsSL -o elm.gz https://github.com/elm/compiler/releases/download/0.19.2/elm-0.19.2-linux-x64.gz
          gunzip elm.gz
          chmod +x elm
          sudo mv elm /usr/local/bin/elm

      - uses: extractions/setup-just@v3

      - name: Build
        run: just build

      - name: Test
        run: go test ./...
