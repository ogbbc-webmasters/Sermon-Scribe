<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sermon Scribe</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <script src="/elm.js"></script>
  <script>
    const app = Elm.Main.init({ node: document.getElementById("app") });
    const draftKey = (id) => "sermon-scribe:timeline:" + id;
    app.ports.loadTimelineDraft?.subscribe((id) => {
      let value = null;
      try { value = JSON.parse(localStorage.getItem(draftKey(String(id)))); } catch (_) {}
      app.ports.timelineDraftLoaded?.send({ id: String(id), draft: value });
    });
    app.ports.saveTimelineDraft?.subscribe((value) => {
      try { if (value && typeof value.id === "string") localStorage.setItem(draftKey(value.id), JSON.stringify(value.draft)); } catch (_) {}
    });
    app.ports.clearTimelineDraft?.subscribe((id) => { try { localStorage.removeItem(draftKey(String(id))); } catch (_) {} });

    let renderModel = null, observer = null, preview = null, frame = 0, lastReport = 0;
    const audio = () => document.getElementById("timeline-audio");
    function sourceTime(playbackTime) {if(preview?.mode!=="final")return playbackTime;const kept=(preview.regions||[]).filter((region)=>region.keep);let remaining=Math.max(0,playbackTime);for(let index=0;index<kept.length;index++){const region=kept[index],length=Math.max(0,region.end-region.start);if(remaining<length||index===kept.length-1)return Math.min(region.end,region.start+remaining);remaining-=length;}return 0;}
    function cleanupCanvas() { observer?.disconnect(); observer = null; }
    function draw() {
      const canvas = document.getElementById("timeline-canvas");
      if (!canvas || !renderModel || !Array.isArray(renderModel.samples)) { cleanupCanvas(); return; }
      const rect = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr)); canvas.height = Math.max(1, Math.round(rect.height * dpr));
      const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr); const w = rect.width, h = rect.height, duration = renderModel.duration || 1, viewStart = renderModel.view_start || 0, viewEnd = renderModel.view_end || duration, viewDuration = Math.max(.001, viewEnd - viewStart);
      const styles=getComputedStyle(document.documentElement), color=(name)=>styles.getPropertyValue(name).trim();
      ctx.fillStyle = color("--card"); ctx.fillRect(0, 0, w, h);
      (renderModel.regions || []).forEach((r,index) => {
        const start=Math.max(viewStart,r.start),end=Math.min(viewEnd,r.end);if(end<=start)return;
        const left=(start-viewStart)/viewDuration*w,right=(end-viewStart)/viewDuration*w,width=right-left;
        ctx.fillStyle=color(r.type === "speaking" ? "--green-line" : r.type === "singing" ? "--red-line" : "--line");ctx.fillRect(left,0,width,h);
        ctx.save();ctx.strokeStyle=color("--ink");ctx.fillStyle=color("--ink");ctx.globalAlpha=.22;ctx.lineWidth=1;
        if(r.type==="singing"){for(let x=left-h;x<right;x+=14){ctx.beginPath();ctx.moveTo(x,h);ctx.lineTo(x+h,0);ctx.stroke();}}
        if(r.type==="silence"){for(let y=12;y<h;y+=16){for(let x=left+8;x<right;x+=16)ctx.fillRect(x,y,2,2);}}
        ctx.restore();
        if(!r.keep){ctx.save();ctx.globalAlpha=.24;ctx.fillStyle=color("--ink");for(let x=left;x<right;x+=12)ctx.fillRect(x,0,5,h);ctx.restore();}
        if(width>72){ctx.save();ctx.fillStyle=color("--ink");ctx.globalAlpha=.8;ctx.font="600 12px system-ui, sans-serif";ctx.textAlign="center";ctx.fillText(r.type==="speaking"?"SPEECH":r.type.toUpperCase(),left+width/2,18);ctx.fillText(r.keep?"KEEP":"DELETE",left+width/2,h-10);ctx.restore();}
      });
      ctx.fillStyle = color("--ink"); const samples=renderModel.samples, first=Math.max(0,Math.floor(viewStart/duration*samples.length)),last=Math.min(samples.length,Math.ceil(viewEnd/duration*samples.length)),per=Math.max(1,Math.floor((last-first)/w));
      for(let x=0;x<w;x++){ let peak=0,start=first+Math.floor(x*(last-first)/w);for(let i=start;i<Math.min(last,start+per);i++)peak=Math.max(peak,Math.abs(samples[i]||0));ctx.fillRect(x,h/2-peak*h*.45,1,Math.max(1,peak*h*.9)); }
      (renderModel.regions || []).forEach((r,index) => {if(index===renderModel.selected)return;const start=Math.max(viewStart,r.start),end=Math.min(viewEnd,r.end);if(end<=start)return;ctx.save();ctx.globalAlpha=.55;ctx.fillStyle=color("--card");ctx.fillRect((start-viewStart)/viewDuration*w,0,(end-start)/viewDuration*w,h);ctx.restore();});
      const selected=(renderModel.regions || [])[renderModel.selected];if(selected){const start=Math.max(viewStart,selected.start),end=Math.min(viewEnd,selected.end);if(end>start){const left=(start-viewStart)/viewDuration*w,width=(end-start)/viewDuration*w;ctx.save();ctx.fillStyle=color("--ink");ctx.fillRect(left,0,width,5);ctx.fillRect(left,h-5,width,5);ctx.strokeStyle=color("--ink");ctx.lineWidth=2;ctx.strokeRect(left+1,1,Math.max(0,width-2),h-2);ctx.restore();}}
      const playhead=renderModel.playhead||0;if(playhead>=viewStart&&playhead<=viewEnd){ctx.strokeStyle=color("--green-dark");ctx.lineWidth=2;ctx.beginPath();ctx.moveTo((playhead-viewStart)/viewDuration*w,0);ctx.lineTo((playhead-viewStart)/viewDuration*w,h);ctx.stroke();}
      (renderModel.regions||[]).slice(1).filter((r)=>r.start>=viewStart&&r.start<=viewEnd).forEach((r)=>{ctx.fillStyle=color("--ink");ctx.fillRect((r.start-viewStart)/viewDuration*w-2,0,4,h);});
      if (!observer) { observer = new ResizeObserver(draw); observer.observe(canvas); canvas.addEventListener("pointerdown", pointer); }
    }
    function pointer(event) { const canvas=event.currentTarget,regions=renderModel?.regions||[],rect=canvas.getBoundingClientRect(),viewStart=renderModel.view_start||0,viewEnd=renderModel.view_end||renderModel.duration,viewDuration=viewEnd-viewStart;if(!regions.length||canvas.dataset.busy==="true")return;const eventTime=viewStart+(event.clientX-rect.left)/rect.width*viewDuration,index=regions.findIndex((region)=>eventTime>=region.start&&eventTime<=region.end);if(index>=0)app.ports.timelineRegionSelected?.send(index); }
    let auditionEnd = null;
    const boundaryAudio = () => document.getElementById("boundary-audio");
    function stopAudition(notify) {const player=boundaryAudio();if(player)player.pause();auditionEnd=null;if(notify)app.ports.boundaryAuditionEnded?.send(null);}
    app.ports.auditionBoundary?.subscribe((value)=>{stopAudition(false);if(!value||!Number.isFinite(value.start)||!Number.isFinite(value.end)||value.end<=value.start)return;const player=boundaryAudio();if(!player){app.ports.boundaryAuditionEnded?.send(null);return;}player.currentTime=value.start;auditionEnd=value.end;player.play().catch(()=>stopAudition(true));});
    document.addEventListener("timeupdate",(event)=>{if(event.target===boundaryAudio()&&auditionEnd!==null&&event.target.currentTime>=auditionEnd-.02)stopAudition(true);},true);
    document.addEventListener("ended",(event)=>{if(event.target===boundaryAudio()&&auditionEnd!==null)stopAudition(true);},true);
    app.ports.renderTimeline?.subscribe((value)=>{if(auditionEnd!==null)stopAudition(true);renderModel=value;requestAnimationFrame(draw);});
    function loop(now){const player=audio();if(player&&preview){if(preview.mode==="preview"&&!player.paused){const cut=(preview.regions||[]).find(r=>!r.keep&&player.currentTime>=r.start&&player.currentTime<r.end);if(cut)player.currentTime=cut.end;}if(now-lastReport>100){lastReport=now;const playhead=sourceTime(player.currentTime||0);app.ports.previewPlayhead?.send(playhead);if(renderModel){renderModel.playhead=playhead;draw();}}}frame=requestAnimationFrame(loop);}
    app.ports.configurePreview?.subscribe((value)=>{preview=value&&typeof value==="object"?value:null;if(!preview){cancelAnimationFrame(frame);frame=0;renderModel=null;cleanupCanvas();}else if(!frame)frame=requestAnimationFrame(loop);});
    document.addEventListener("keydown",(event)=>{const modal=document.querySelector('[aria-modal="true"]');if(!modal||event.key!=="Tab")return;const controls=[...modal.querySelectorAll("button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex=\"-1\"])")];if(!controls.length)return;const first=controls[0],last=controls[controls.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}});
    const events = new EventSource("/api/events");
    ["snapshot", "stage_started", "progress", "stage_completed", "failed", "deleted"]
      .forEach((eventName) => {
        events.addEventListener(eventName, (event) => {
          try {
            app.ports.pipelineEvents.send({
              event: eventName,
              data: JSON.parse(event.data)
            });
          } catch (error) {
            console.error("Could not read pipeline event", error);
          }
        });
      });
  </script>
</body>
</html>
