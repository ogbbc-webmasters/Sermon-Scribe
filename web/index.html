<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sermon Scribe</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <script src="/elm.js"></script>
  <script src="/editing.js"></script>
  <script src="/waveform.js"></script>
  <script>
    const app = Elm.Main.init({ node: document.getElementById("app") });
    initializeEditingAudio(app);
    app.ports.downloadExport.subscribe((url) => {
      const link = document.createElement("a");
      link.href = url;
      link.download = "sermon.mp3";
      document.body.append(link);
      link.click();
      link.remove();
    });
    app.ports.copyTranscript?.subscribe(async (text) => {
      try {
        await navigator.clipboard.writeText(text);
        app.ports.transcriptCopied.send(true);
      } catch (_) {
        app.ports.transcriptCopied.send(false);
      }
    });
    app.ports.scrollTranscriptMatch?.subscribe((index) => {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const match = document.querySelector(`[data-transcript-match="${index}"]`);
        const transcript = document.querySelector(".sermon-detail__transcript");
        if (match && transcript) {
          transcript.scrollTop += match.getBoundingClientRect().top - transcript.getBoundingClientRect().top
            - transcript.clientHeight / 2 + match.getBoundingClientRect().height / 2;
        }
      }));
    });
    const events = new EventSource("/api/events");
    ["snapshot", "stage_started", "progress", "stage_completed", "failed", "deleted"]
      .forEach((eventName) => {
        events.addEventListener(eventName, (event) => {
          try {
            app.ports.pipelineEvents.send({
              event: eventName,
              data: JSON.parse(event.data)
            });
          } catch (error) {
            console.error("Could not read pipeline event", error);
          }
        });
      });
  </script>
</body>
</html>
