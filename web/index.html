<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sermon Scribe</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"></div>
  <script src="/elm.js"></script>
  <script>
    const app = Elm.Main.init({ node: document.getElementById("app") });
    const draftKey = (id) => "sermon-scribe:timeline:" + id;
    app.ports.loadTimelineDraft?.subscribe((id) => {
      let value = null;
      try { value = JSON.parse(localStorage.getItem(draftKey(String(id)))); } catch (_) {}
      app.ports.timelineDraftLoaded?.send({ id: String(id), draft: value });
    });
    app.ports.saveTimelineDraft?.subscribe((value) => {
      try { if (value && typeof value.id === "string") localStorage.setItem(draftKey(value.id), JSON.stringify(value.draft)); } catch (_) {}
    });
    app.ports.clearTimelineDraft?.subscribe((id) => { try { localStorage.removeItem(draftKey(String(id))); } catch (_) {} });

    let renderModel = null, observer = null, preview = null, frame = 0, lastReport = 0, stopAt = null, drag = null;
    const audio = () => document.getElementById("timeline-audio");
    function cleanupCanvas() { observer?.disconnect(); observer = null; if (drag) drag.cleanup(); }
    function draw() {
      const canvas = document.getElementById("timeline-canvas");
      if (!canvas || !renderModel || !Array.isArray(renderModel.samples)) { cleanupCanvas(); return; }
      const rect = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr)); canvas.height = Math.round(220 * dpr);
      const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr); const w = rect.width, h = 220, duration = renderModel.duration || 1, viewStart = renderModel.view_start || 0, viewEnd = renderModel.view_end || duration, viewDuration = Math.max(.001, viewEnd - viewStart);
      const styles=getComputedStyle(document.documentElement), color=(name)=>styles.getPropertyValue(name).trim();
      ctx.fillStyle = color("--card"); ctx.fillRect(0, 0, w, h);
      (renderModel.regions || []).forEach((r) => { const start=Math.max(viewStart,r.start),end=Math.min(viewEnd,r.end);if(end<=start)return;ctx.fillStyle = color(r.type === "speaking" ? "--green-line" : r.type === "singing" ? "--red-line" : "--line"); ctx.fillRect((start-viewStart)/viewDuration*w, 0, (end-start)/viewDuration*w, h); if (!r.keep) { ctx.save();ctx.globalAlpha=.18;ctx.fillStyle=color("--ink");for(let x=(start-viewStart)/viewDuration*w;x<(end-viewStart)/viewDuration*w;x+=12)ctx.fillRect(x,0,5,h);ctx.restore(); } });
      ctx.fillStyle = color("--ink"); const samples=renderModel.samples, first=Math.max(0,Math.floor(viewStart/duration*samples.length)),last=Math.min(samples.length,Math.ceil(viewEnd/duration*samples.length)),per=Math.max(1,Math.floor((last-first)/w));
      for(let x=0;x<w;x++){ let peak=0,start=first+Math.floor(x*(last-first)/w);for(let i=start;i<Math.min(last,start+per);i++)peak=Math.max(peak,Math.abs(samples[i]||0));ctx.fillRect(x,h/2-peak*h*.45,1,Math.max(1,peak*h*.9)); }
      const playhead=renderModel.playhead||0;if(playhead>=viewStart&&playhead<=viewEnd){ctx.strokeStyle=color("--green-dark");ctx.lineWidth=2;ctx.beginPath();ctx.moveTo((playhead-viewStart)/viewDuration*w,0);ctx.lineTo((playhead-viewStart)/viewDuration*w,h);ctx.stroke();}
      (renderModel.regions||[]).slice(1).filter((r)=>r.start>=viewStart&&r.start<=viewEnd).forEach((r)=>{ctx.fillStyle=color("--ink");ctx.fillRect((r.start-viewStart)/viewDuration*w-2,0,4,h);});
      if (!observer) { observer = new ResizeObserver(draw); observer.observe(canvas); canvas.addEventListener("pointerdown", pointer); }
    }
    function pointer(event) { const canvas=event.currentTarget, regions=renderModel?.regions||[], rect=canvas.getBoundingClientRect(),viewStart=renderModel.view_start||0,viewEnd=renderModel.view_end||renderModel.duration,viewDuration=viewEnd-viewStart;if(regions.length<2||canvas.dataset.busy==="true")return;let boundary=0,best=Infinity;regions.slice(1).forEach((r,i)=>{if(r.start<viewStart||r.start>viewEnd)return;const d=Math.abs((r.start-viewStart)/viewDuration*rect.width-(event.clientX-rect.left));if(d<best){best=d;boundary=i+1;}});if(best>15)return;canvas.setPointerCapture(event.pointerId);const send=(e)=>{const box=canvas.getBoundingClientRect(),time=Math.max(viewStart,Math.min(viewEnd,viewStart+(e.clientX-box.left)/box.width*viewDuration));app.ports.timelineBoundary?.send({boundary,time});};const move=(e)=>send(e);const cleanup=()=>{canvas.removeEventListener("pointermove",move);canvas.removeEventListener("pointerup",cleanup);canvas.removeEventListener("pointercancel",cleanup);canvas.removeEventListener("lostpointercapture",cleanup);if(drag?.cleanup===cleanup)drag=null;};drag={cleanup};canvas.addEventListener("pointermove",move);canvas.addEventListener("pointerup",cleanup);canvas.addEventListener("pointercancel",cleanup);canvas.addEventListener("lostpointercapture",cleanup);send(event); }
    app.ports.renderTimeline?.subscribe((value)=>{renderModel=value; requestAnimationFrame(draw);});
    function loop(now){const player=audio();if(player&&preview){if(stopAt!=null&&player.currentTime>=stopAt){player.pause();stopAt=null;}if(preview.mode==="preview"&&!player.paused){const cut=(preview.regions||[]).find(r=>!r.keep&&player.currentTime>=r.start&&player.currentTime<r.end);if(cut)player.currentTime=cut.end;}if(now-lastReport>100){lastReport=now;app.ports.previewPlayhead?.send(player.currentTime||0);if(renderModel){renderModel.playhead=player.currentTime||0;draw();}}}frame=requestAnimationFrame(loop);}
    app.ports.configurePreview?.subscribe((value)=>{preview=value&&typeof value==="object"?value:null;if(!preview){cancelAnimationFrame(frame);frame=0;renderModel=null;stopAt=null;cleanupCanvas();}else if(!frame)frame=requestAnimationFrame(loop);});
    app.ports.playTimelineRegion?.subscribe((r)=>{const player=audio();if(player&&r&&Number.isFinite(r.start)&&Number.isFinite(r.end)){player.currentTime=r.start;stopAt=r.end;player.play().catch(()=>{});}});
    const events = new EventSource("/api/events");
    ["snapshot", "stage_started", "progress", "stage_completed", "failed", "deleted"]
      .forEach((eventName) => {
        events.addEventListener(eventName, (event) => {
          try {
            app.ports.pipelineEvents.send({
              event: eventName,
              data: JSON.parse(event.data)
            });
          } catch (error) {
            console.error("Could not read pipeline event", error);
          }
        });
      });
  </script>
</body>
</html>
